tergefallenes Betriebssystem auf den PC mit Wingdows (er stoppt, sobald kein Ende mehr Wingdows hat). Ein PC, der durch einen Funken zu Wingdows wurde, lässt sein altes System nicht fallen – nimm eines, das ein anderer Bill verloren hat.","rules.4":"Das Spiel endet, wenn nur noch höchstens 1 PC läuft. Nach jedem Level gibt es einen Bonus entsprechend der Laufzeit.","rules.5.head":"Schaffe Level 10 und gewinne!","rules.5.body":" Auf höheren Leveln kommen mehr Bills gleichzeitig, schneller, und sie stehlen Systeme schneller. Wer alle Level schafft, kann eine Urkunde (Bild) mit seinem Namen herunterladen.","credit.line":"XBill 2.1  Copyright (C) Brian Wellington, Matias Duarte (GPL). Regeln und Grafiken stammen aus dem Originalspiel.","credit.source":"Quellcode dieses Spiels (GPL-3.0 oder neuer): ","title.start":"🎮 START","title.fullscreen":"⛶ Vollbild umschalten","title.sub1":"Beschütze freie Betriebssysteme vor der Bill-Horde!","title.sub2":"Verhindere die Zwangsinstallation von Wingdows!","help.title":"XBill-Anleitung (Originalregeln)","help.keys":"Tasten: P / Esc = Pause, M = Ton","help.close":"Schließen","level.n":"LEVEL {n}","level.final":"FINAL-LEVEL {n}","clear.headline":"Alle Bills abgewehrt!","clear.killed":"Besiegte Bills: {n}","clear.goto":"▶ Weiter zu {next}","label.bonus":"Laufzeit-Bonus: ","label.score":"Punkte: ","label.finalScore":"Endstand: ","result.bonus":"Laufzeit-Bonus: +{n} pts","result.allClearBonus":"All-Clear-Bonus: +{n} pts","result.clearedHeadline":"Glückwunsch! Du hast alle Level geschafft und Wingdows' Pläne zunichtegemacht!","result.overHeadline":"Es läuft nur noch höchstens 1 PC ...","result.retry":"🔄 Nochmal spielen","name.placeholder":"Name (max. 12 Zeichen)","name.aria":"Name für die Bestenliste","name.submit":"🏆 Eintragen","name.sending":"Wird gesendet ...","name.rank":"Platz {rank} in der Bestenliste!","name.outOfRank":"Diesmal nicht in der Bestenliste. Versuch es nochmal!","name.error":"Eintragen fehlgeschlagen. Prüfe deine Verbindung und versuche es erneut.","ranking.title":"🏆 Bestenliste","ranking.titleLocal":"🏆 Bestenliste (nur dieses Gerät)","ranking.loading":"Wird geladen ...","ranking.error":"Bestenliste konnte nicht geladen werden","ranking.empty":"Noch keine Einträge","cert.button":"📜 Urkunde herunterladen","cert.heading":"Urkunde für den vollständigen Abschluss","cert.body":"Hat alle {n} Level von XBill Web Remake geschafft und die Pläne von Wingdows zunichtegemacht.","cert.score":"Endstand","cert.date":"Datum","cert.anonymous":"Spieler","story.button":"📖 Die Geschichte","story.p1":"Wieder einmal liegt das Schicksal der Welt in deinen Händen! Ein böser Computer-Hacker, nur unter dem Namen „Bill“ bekannt, hat den ultimativen Computervirus erschaffen. Einen Virus, der so mächtig ist, dass er einen gewöhnlichen Computer in einen Toaster verwandeln kann. (oooh!) „Bill“ hat sich zu Milliarden und Abermilliarden Mikro-Bills geklont. Ihr einziger Zweck ist es, den üblen Virus zu verbreiten, der geschickt als beliebtes Betriebssystem getarnt wurde.","story.p2":"Als Systemadministrator und Kammerjäger ist es deine Aufgabe, Bill daran zu hindern, sein Ziel zu erreichen."},"en":{"btn.pause":"Pause (II)","btn.resume":"Resume (▶)","btn.reset":"Reset","aria.sound":"Toggle sound","aria.help":"How to play","page.title":"XBill Web Remake - Whack the Bills, protect your OS","lang.label":"Language","status.ready":"SYSTEM READY: watching for Bills...","status.pickedOs":"Picked up {os}! Drag it to a PC of the same type to restore it!","status.pickedBucket":"Got the bucket! Splash a spark to restart it from the beginning!","status.restored":"{os} restored!","status.bucketHit":"Splashed the spark!","status.bucketMiss":"Missed... splash the bucket on a spark","status.paused":"Paused","status.resumed":"Resumed","status.levelStart":"LEVEL {n}: The Bills are coming! Protect the PCs!","status.levelStartFinal":"LEVEL {n} (FINAL): The Bills attack in force! Hold them off!","status.levelCleared":"LEVEL {n} cleared!","status.allClear":"ALL CLEAR! You beat every level!","status.gameOver":"Game over: only 1 or fewer computers are still running","status.imageError":"Could not load the images. Please reload the page.","rules.title":"🕹️ Rules (based on the original XBill 2.1):","rules.1.head":"Whack the Bills","rules.1.body":": Click or tap to take them out. Hit several overlapping Bills at once for a bigger score (number defeated squared × 5 points).","rules.2.head":"Get the OS back","rules.2.body":": A Bill replaces a PC's OS with Wingdows and runs off with the stolen OS on his head. Whack him and he drops it — drag it back to a PC of the same type. Bills that escape come back later.","rules.3.head":"Stop the sparks","rules.3.body":": If only one of two cable-connected PCs is Wingdows, a spark runs along the cable to the other. Dragging the bucket from the top-left onto a spark only restarts it from the beginning. To stop it for good, drag a dropped OS back onto the PC that is running Wingdows (it stops once neither end is Wingdows). A PC that Wingdows took over through a spark does not drop its old OS, so use an OS dropped by another Bill.","rules.4":"The game ends when 1 or fewer PCs are still running. After each level you get a bonus based on uptime.","rules.5.head":"Clear level 10 to win!","rules.5.body":" On higher levels, more Bills come at once, faster, and steal OSes faster. Clear every level and you can download a certificate (image) with your name on it.","credit.line":"XBill 2.1  Copyright (C) Brian Wellington, Matias Duarte (GPL). The rules and graphics are from the original game.","credit.source":"Source code of this game (GPL-3.0 or later): ","title.start":"🎮 START","title.fullscreen":"⛶ Toggle fullscreen","title.sub1":"Protect open-source operating systems from the Bill horde!","title.sub2":"Stop the forced installation of Wingdows!","help.title":"XBill Guide (original rules)","help.keys":"Keys: P / Esc = pause, M = toggle sound","help.close":"Close","level.n":"LEVEL {n}","level.final":"FINAL LEVEL {n}","clear.headline":"You drove off every Bill!","clear.killed":"Bills defeated: {n}","clear.goto":"▶ Go to {next}","label.bonus":"Uptime bonus: ","label.score":"Score: ","label.finalScore":"Final score: ","result.bonus":"Uptime bonus: +{n} pts","result.allClearBonus":"All-clear bonus: +{n} pts","result.clearedHeadline":"Congratulations! You cleared every level and crushed Wingdows' ambitions!","result.overHeadline":"Only 1 or fewer PCs are still running...","result.retry":"🔄 Play again","name.placeholder":"Name (max 12 chars)","name.aria":"Name for the ranking","name.submit":"🏆 Submit","name.sending":"Sending...","name.rank":"You ranked #{rank}!","name.outOfRank":"Didn't make the ranking this time. Try again!","name.error":"Could not submit. Check your connection and try again.","ranking.title":"🏆 Ranking","ranking.titleLocal":"🏆 Ranking (this device only)","ranking.loading":"Loading...","ranking.error":"Could not load the ranking","ranking.empty":"No records yet","cert.button":"📜 Download certificate","cert.heading":"Certificate of Completion","cert.body":"Cleared all {n} levels of XBill Web Remake and crushed the ambitions of Wingdows.","cert.score":"Final score","cert.date":"Date","cert.anonymous":"Player","story.button":"📖 Story","story.p1":"Yet again, the fate of the world rests in your hands! An evil computer hacker, known only by his handle 'Bill', has created the ultimate computer virus. A virus so powerful that it has the power to transmute an ordinary computer into a toaster oven. (oooh!) 'Bill' has cloned himself into a billion-jillion micro-Bills. Their sole purpose is to deliver the nefarious virus, which has been cleverly disguised as a popular operating system.","story.p2":"As System Administrator/Exterminator, your job is to keep Bill from succeeding at his task."},"es":{"btn.pause":"Pausa (II)","btn.resume":"Continuar (▶)","btn.reset":"Reiniciar","aria.sound":"Activar o desactivar el sonido","aria.help":"Cómo jugar","page.title":"XBill Web Remake - Golpea a los Bills y protege tus sistemas operativos","lang.label":"Idioma","status.ready":"SYSTEM READY: vigilando la invasión de los Bills...","status.pickedOs":"¡Has recogido {os}! Arrástralo a un PC del mismo tipo para restaurarlo.","status.pickedBucket":"¡Tienes el cubo! Échalo sobre una chispa para que vuelva a empezar desde el principio.","status.restored":"¡{os} restaurado!","status.bucketHit":"¡Agua sobre la chispa!","status.bucketMiss":"Fallaste... échalo sobre una chispa","status.paused":"En pausa","status.resumed":"Juego reanudado","status.levelStart":"LEVEL {n}: ¡Llegan los Bills! ¡Protege los PC!","status.levelStartFinal":"LEVEL {n} (FINAL): ¡Ataque total de los Bills! ¡Defiende los PC!","status.levelCleared":"¡LEVEL {n} superado!","status.allClear":"¡ALL CLEAR! ¡Has superado todos los niveles!","status.gameOver":"Fin del juego: queda 1 ordenador o ninguno en funcionamiento","status.imageError":"No se pudieron cargar las imágenes. Recarga la página.","rules.title":"🕹️ Reglas (basadas en el XBill 2.1 original):","rules.1.head":"Golpea a los Bills","rules.1.body":": Haz clic o toca para derribarlos. Cuantos más Bills superpuestos derribes de una vez, más puntos (cantidad derribada al cuadrado × 5 puntos).","rules.2.head":"Recupera el sistema operativo","rules.2.body":": Un Bill cambia el sistema operativo del PC por Wingdows y huye con el sistema robado sobre la cabeza. Si lo golpeas, lo suelta: arrástralo a un PC del mismo tipo. Los Bills que escapan vuelven más tarde.","rules.3.head":"Detén las chispas","rules.3.body":": Si solo uno de dos PC conectados por cable tiene Wingdows, una chispa viaja por el cable hacia el otro. Arrastrar el cubo de arriba a la izquierda sobre una chispa solo la reinicia desde el principio. Para detenerla del todo, arrastra un sistema operativo caído al PC que tiene Wingdows (se detiene cuando ningún extremo tiene Wingdows). Un PC que se convirtió en Wingdows por una chispa no suelta su sistema anterior, así que usa uno soltado por otro Bill.","rules.4":"La partida termina cuando queda 1 PC o ninguno en funcionamiento. Al terminar cada nivel recibes una bonificación según el tiempo de funcionamiento.","rules.5.head":"¡Supera el nivel 10 para ganar!","rules.5.body":" En los niveles altos llegan más Bills a la vez, más rápido, y roban los sistemas con más rapidez. Si superas todos los niveles, puedes descargar un certificado (imagen) con tu nombre.","credit.line":"XBill 2.1  Copyright (C) Brian Wellington, Matias Duarte (GPL). Las reglas y los gráficos son del juego original.","credit.source":"Código fuente de este juego (GPL-3.0 o posterior): ","title.start":"🎮 EMPEZAR (START)","title.fullscreen":"⛶ Pantalla completa","title.sub1":"¡Protege los sistemas operativos libres de la horda de Bills!","title.sub2":"¡Impide la instalación forzosa de Wingdows!","help.title":"Guía de XBill (reglas originales)","help.keys":"Teclas: P / Esc = pausa, M = sonido","help.close":"Cerrar","level.n":"LEVEL {n}","level.final":"LEVEL {n} (FINAL)","clear.headline":"¡Has derrotado a todos los Bills!","clear.killed":"Bills derrotados: {n}","clear.goto":"▶ Ir a {next}","label.bonus":"Bonificación de funcionamiento: ","label.score":"Puntos: ","label.finalScore":"Puntuación final: ","result.bonus":"Bonificación de funcionamiento: +{n} pts","result.allClearBonus":"Bonificación por completarlo todo: +{n} pts","result.clearedHeadline":"¡Enhorabuena! ¡Has superado todos los niveles y aplastado los planes de Wingdows!","result.overHeadline":"Queda 1 PC o ninguno en funcionamiento...","result.retry":"🔄 Jugar otra vez","name.placeholder":"Nombre (máx. 12 caracteres)","name.aria":"Nombre para la clasificación","name.submit":"🏆 Enviar","name.sending":"Enviando...","name.rank":"¡Has entrado en el puesto {rank}!","name.outOfRank":"Esta vez no has entrado en la clasificación. ¡Inténtalo de nuevo!","name.error":"No se pudo enviar. Comprueba tu conexión e inténtalo de nuevo.","ranking.title":"🏆 Clasificación","ranking.titleLocal":"🏆 Clasificación (solo este dispositivo)","ranking.loading":"Cargando...","ranking.error":"No se pudo cargar la clasificación","ranking.empty":"Aún no hay registros","cert.button":"📜 Descargar certificado","cert.heading":"Certificado de finalización","cert.body":"Superó los {n} niveles de XBill Web Remake y aplastó las ambiciones de Wingdows.","cert.score":"Puntuación final","cert.date":"Fecha","cert.anonymous":"Jugador","story.button":"📖 Historia","story.p1":"¡Una vez más, el destino del mundo está en tus manos! Un malvado hacker informático, conocido solo por su alias «Bill», ha creado el virus informático definitivo. Un virus tan potente que puede transformar un ordenador normal en un horno tostador. (¡oooh!) «Bill» se ha clonado en miles de millones de micro-Bills. Su único propósito es propagar el perverso virus, hábilmente disfrazado de un sistema operativo popular.","story.p2":"Como administrador de sistemas y exterminador, tu misión es impedir que Bill logre su objetivo."},"fr":{"btn.pause":"Pause (II)","btn.resume":"Reprendre (▶)","btn.reset":"Réinitialiser","aria.sound":"Activer ou couper le son","aria.help":"Comment jouer","page.title":"XBill Web Remake - Frappez les Bills, protégez vos systèmes","lang.label":"Langue","status.ready":"SYSTEM READY : surveillance de l'invasion des Bills...","status.pickedOs":"{os} ramassé ! Faites-le glisser sur un PC du même type pour le restaurer !","status.pickedBucket":"Vous avez le seau ! Versez-le sur une étincelle pour qu'elle reparte de zéro !","status.restored":"{os} restauré !","status.bucketHit":"Étincelle arrosée !","status.bucketMiss":"Raté... visez une étincelle","status.paused":"En pause","status.resumed":"Partie reprise","status.levelStart":"LEVEL {n} : les Bills arrivent ! Protégez les PC !","status.levelStartFinal":"LEVEL {n} (FINAL) : assaut général des Bills ! Tenez bon !","status.levelCleared":"LEVEL {n} terminé !","status.allClear":"ALL CLEAR ! Vous avez terminé tous les niveaux !","status.gameOver":"Partie terminée : il ne reste qu'un ordinateur (ou aucun) en marche","status.imageError":"Impossible de charger les images. Rechargez la page.","rules.title":"🕹️ Règles (d'après le XBill 2.1 original) :","rules.1.head":"Frappez les Bills","rules.1.body":": Cliquez ou touchez pour les mettre K.O. Plus vous en éliminez d'un coup, plus le score est élevé (nombre éliminé au carré × 5 points).","rules.2.head":"Récupérez le système","rules.2.body":": Un Bill remplace le système du PC par Wingdows et s'enfuit avec le système volé sur la tête. Frappez-le : il le lâche. Faites-le glisser sur un PC du même type. Les Bills qui s'échappent reviennent plus tard.","rules.3.head":"Arrêtez les étincelles","rules.3.body":": Si un seul de deux PC reliés par un câble tourne sous Wingdows, une étincelle court le long du câble vers l'autre. Faire glisser le seau en haut à gauche sur une étincelle ne fait que la relancer depuis le début. Pour l'arrêter pour de bon, faites glisser un système tombé sur le PC sous Wingdows (elle s'arrête quand aucune extrémité n'est sous Wingdows). Un PC passé sous Wingdows à cause d'une étincelle ne lâche pas son ancien système : utilisez celui qu'un autre Bill a laissé tomber.","rules.4":"La partie se termine quand il ne reste qu'un PC (ou aucun) en marche. À la fin de chaque niveau, vous recevez un bonus selon le taux de disponibilité.","rules.5.head":"Terminez le niveau 10 pour tout finir !","rules.5.body":" Plus le niveau est élevé, plus les Bills arrivent nombreux, vite, et volent les systèmes rapidement. Terminez tous les niveaux pour télécharger un certificat (image) à votre nom.","credit.line":"XBill 2.1  Copyright (C) Brian Wellington, Matias Duarte (GPL). Les règles et les graphismes viennent du jeu original.","credit.source":"Code source de ce jeu (GPL-3.0 ou ultérieure) : ","title.start":"🎮 JOUER (START)","title.fullscreen":"⛶ Plein écran","title.sub1":"Protégez les systèmes libres de la horde de Bills !","title.sub2":"Empêchez l'installation forcée de Wingdows !","help.title":"Guide de XBill (règles originales)","help.keys":"Touches : P / Échap = pause, M = son","help.close":"Fermer","level.n":"LEVEL {n}","level.final":"LEVEL {n} (FINAL)","clear.headline":"Tous les Bills ont été repoussés !","clear.killed":"Bills éliminés : {n}","clear.goto":"▶ Passer à {next}","label.bonus":"Bonus de disponibilité : ","label.score":"Score : ","label.finalScore":"Score final : ","result.bonus":"Bonus de disponibilité : +{n} pts","result.allClearBonus":"Bonus de victoire totale : +{n} pts","result.clearedHeadline":"Bravo ! Vous avez terminé tous les niveaux et brisé les ambitions de Wingdows !","result.overHeadline":"Il ne reste qu'un PC (ou aucun) en marche...","result.retry":"🔄 Rejouer","name.placeholder":"Nom (12 caractères max.)","name.aria":"Nom pour le classement","name.submit":"🏆 Envoyer","name.sending":"Envoi...","name.rank":"Vous entrez au classement à la place n° {rank} !","name.outOfRank":"Pas de classement cette fois. Réessayez !","name.error":"Envoi impossible. Vérifiez votre connexion et réessayez.","ranking.title":"🏆 Classement","ranking.titleLocal":"🏆 Classement (cet appareil uniquement)","ranking.loading":"Chargement...","ranking.error":"Impossible de charger le classement","ranking.empty":"Aucun score pour le moment","cert.button":"📜 Télécharger le certificat","cert.heading":"Certificat de réussite","cert.body":"A terminé les {n} niveaux de XBill Web Remake et brisé les ambitions de Wingdows.","cert.score":"Score final","cert.date":"Date","cert.anonymous":"Joueur","story.button":"📖 Histoire","story.p1":"Une fois de plus, le sort du monde est entre vos mains ! Un affreux pirate informatique, connu seulement sous le pseudonyme de « Bill », a créé le virus informatique ultime. Un virus si puissant qu'il peut transformer un ordinateur ordinaire en grille-pain. (oooh !) « Bill » s'est cloné en des milliards de micro-Bills. Leur unique but : diffuser ce virus infâme, astucieusement déguisé en système d'exploitation populaire.","story.p2":"En tant qu'administrateur système et exterminateur, votre mission est d'empêcher Bill de parvenir à ses fins."},"hi":{"btn.pause":"रोकें (II)","btn.resume":"जारी रखें (▶)","btn.reset":"रीसेट","aria.sound":"ध्वनि चालू/बंद करें","aria.help":"कैसे खेलें","page.title":"XBill Web Remake - बिल्स को मारो, अपने OS को बचाओ","lang.label":"भाषा","status.ready":"SYSTEM READY: बिल्स की घुसपैठ पर नज़र...","status.pickedOs":"{os} उठाया! उसे उसी प्रकार के PC पर खींचकर वापस लगाओ!","status.pickedBucket":"बाल्टी मिल गई! उसे चिंगारी पर डालो, चिंगारी शुरू से चलेगी!","status.restored":"{os} बहाल हो गया!","status.bucketHit":"चिंगारी पर पानी पड़ा!","status.bucketMiss":"निशाना चूका... बाल्टी चिंगारी पर डालो","status.paused":"रुका हुआ","status.resumed":"खेल जारी","status.levelStart":"LEVEL {n}: बिल्स आ रहे हैं! PC बचाओ!","status.levelStartFinal":"LEVEL {n} (अंतिम): बिल्स का पूरा हमला! डटे रहो!","status.levelCleared":"LEVEL {n} पूरा!","status.allClear":"ALL CLEAR! तुमने सारे लेवल पूरे कर लिए!","status.gameOver":"खेल खत्म: 1 या उससे कम कंप्यूटर चालू बचे हैं","status.imageError":"चित्र लोड नहीं हो सके। कृपया पेज फिर से लोड करें।","rules.title":"🕹️ नियम (मूल XBill 2.1 के अनुसार):","rules.1.head":"बिल्स को मारो","rules.1.body":": क्लिक या टैप करके उन्हें गिराओ। एक बार में जितने ज़्यादा आपस में मिले हुए बिल्स गिराओगे, उतने ज़्यादा अंक (गिराई गई संख्या का वर्ग × 5 अंक)।","rules.2.head":"OS वापस लाओ","rules.2.body":": बिल PC का OS बदलकर Wingdows डाल देता है और चुराया हुआ OS सिर पर रखकर भाग जाता है। उसे मारो तो OS गिर जाता है; उसे खींचकर उसी प्रकार के PC पर लगा दो। भाग निकले बिल्स बाद में लौट आते हैं।","rules.3.head":"चिंगारियाँ रोको","rules.3.body":": केबल से जुड़े दो PC में से केवल एक में Wingdows हो, तो केबल पर चिंगारी दूसरे की ओर दौड़ती है। ऊपर बाईं ओर की बाल्टी को चिंगारी पर खींचने से वह बस शुरू से दोबारा चलती है। उसे हमेशा के लिए रोकने के लिए, गिरा हुआ OS उस PC पर खींचकर लगाओ जिसमें Wingdows है (दोनों सिरों पर Wingdows न रहे तो चिंगारी रुक जाती है)। चिंगारी से Wingdows बने PC का पुराना OS नहीं गिरता, इसलिए किसी दूसरे बिल के गिराए OS का उपयोग करो।","rules.4":"जब 1 या उससे कम PC चालू बचें तो खेल खत्म। हर लेवल के बाद चालू रहने के समय के अनुसार बोनस मिलता है।","rules.5.head":"लेवल 10 पूरा करो तो जीत!","rules.5.body":" ऊँचे लेवल में एक साथ ज़्यादा बिल्स, ज़्यादा तेज़ी से आते हैं और OS भी जल्दी चुराते हैं। सभी लेवल पूरे करने पर तुम अपने नाम वाला प्रमाणपत्र (चित्र) डाउनलोड कर सकते हो।","credit.line":"XBill 2.1  Copyright (C) Brian Wellington, Matias Duarte (GPL)। नियम और चित्र मूल खेल के हैं।","credit.source":"इस खेल का सोर्स कोड (GPL-3.0 या बाद का): ","title.start":"🎮 शुरू करें (START)","title.fullscreen":"⛶ फ़ुलस्क्रीन बदलें","title.sub1":"ओपन-सोर्स OS को बिल्स की सेना से बचाओ!","title.sub2":"Wingdows की ज़बरदस्ती इंस्टॉलेशन रोको!","help.title":"XBill गाइड (मूल नियम)","help.keys":"कुंजियाँ: P / Esc = रोकें, M = ध्वनि","help.close":"बंद करें","level.n":"LEVEL {n}","level.final":"अंतिम LEVEL {n}","clear.headline":"सभी बिल्स को हरा दिया!","clear.killed":"हराए गए बिल्स: {n}","clear.goto":"▶ {next} पर जाएँ","label.bonus":"चालू रहने का बोनस: ","label.score":"अंक: ","label.finalScore":"अंतिम अंक: ","result.bonus":"चालू रहने का बोनस: +{n} pts","result.allClearBonus":"ऑल-क्लियर बोनस: +{n} pts","result.clearedHeadline":"बधाई! तुमने सारे लेवल पूरे किए और Wingdows के इरादे चकनाचूर कर दिए!","result.overHeadline":"1 या उससे कम PC चालू बचे हैं...","result.retry":"🔄 फिर से खेलें","name.placeholder":"नाम (अधिकतम 12 अक्षर)","name.aria":"रैंकिंग के लिए नाम","name.submit":"🏆 जमा करें","name.sending":"भेजा जा रहा है...","name.rank":"तुम {rank}वें स्थान पर आए!","name.outOfRank":"इस बार रैंकिंग में जगह नहीं मिली। फिर कोशिश करो!","name.error":"जमा नहीं हो सका। अपना कनेक्शन जाँचकर फिर कोशिश करो।","ranking.title":"🏆 रैंकिंग","ranking.titleLocal":"🏆 रैंकिंग (केवल इस डिवाइस पर)","ranking.loading":"लोड हो रहा है...","ranking.error":"रैंकिंग लोड नहीं हो सकी","ranking.empty":"अभी कोई रिकॉर्ड नहीं","cert.button":"📜 प्रमाणपत्र डाउनलोड करें","cert.heading":"पूर्ण-विजय प्रमाणपत्र","cert.body":"XBill Web Remake के सभी {n} लेवल पूरे किए और Wingdows के इरादे चकनाचूर कर दिए।","cert.score":"अंतिम अंक","cert.date":"तारीख़","cert.anonymous":"खिलाड़ी","story.button":"📖 कहानी","story.p1":"एक बार फिर, दुनिया की किस्मत तुम्हारे हाथों में है! सिर्फ़ 'बिल' नाम से जाना जाने वाला एक दुष्ट कंप्यूटर हैकर ने सबसे ख़तरनाक कंप्यूटर वायरस बना दिया है। इतना ताक़तवर वायरस कि वह एक आम कंप्यूटर को टोस्टर ओवन में बदल सकता है। (ऊऊह!) 'बिल' ने ख़ुद को अरबों-खरबों छोटे-छोटे बिल्स में क्लोन कर लिया है। उनका एकमात्र मक़सद इस घातक वायरस को पहुँचाना है, जिसे चालाकी से एक लोकप्रिय ऑपरेटिंग सिस्टम के रूप में छिपाया गया है।","story.p2":"सिस्टम एडमिनिस्ट्रेटर/सफ़ाया करने वाले के तौर पर तुम्हारा काम है कि बिल को उसके मक़सद में कामयाब न होने दो।"},"id":{"btn.pause":"Jeda (II)","btn.resume":"Lanjut (▶)","btn.reset":"Ulang","aria.sound":"Hidupkan/matikan suara","aria.help":"Cara bermain","page.title":"XBill Web Remake - Pukul para Bill, lindungi OS-mu","lang.label":"Bahasa","status.ready":"SYSTEM READY: mengawasi serbuan para Bill...","status.pickedOs":"{os} diambil! Seret ke PC bertipe sama untuk memulihkannya!","status.pickedBucket":"Dapat ember! Siramkan ke percikan api agar mulai lagi dari awal!","status.restored":"{os} dipulihkan!","status.bucketHit":"Percikan api tersiram!","status.bucketMiss":"Meleset... siramkan ember ke percikan api","status.paused":"Dijeda","status.resumed":"Permainan dilanjutkan","status.levelStart":"LEVEL {n}: Para Bill datang! Lindungi PC-nya!","status.levelStartFinal":"LEVEL {n} (AKHIR): Serangan habis-habisan para Bill! Bertahanlah!","status.levelCleared":"LEVEL {n} selesai!","status.allClear":"ALL CLEAR! Semua level berhasil diselesaikan!","status.gameOver":"Game over: tersisa 1 komputer atau kurang yang masih menyala","status.imageError":"Gambar tidak dapat dimuat. Muat ulang halaman.","rules.title":"🕹️ Aturan (berdasarkan XBill 2.1 asli):","rules.1.head":"Pukul para Bill","rules.1.body":": Klik atau ketuk untuk menjatuhkan mereka. Semakin banyak Bill yang bertumpuk kamu kenai sekaligus, semakin tinggi skornya (jumlah yang dijatuhkan dikuadratkan × 5 poin).","rules.2.head":"Rebut kembali OS","rules.2.body":": Bill mengganti OS sebuah PC dengan Wingdows lalu kabur membawa OS curian di kepalanya. Pukul dia dan OS-nya jatuh — seret ke PC bertipe sama. Bill yang berhasil kabur akan kembali lagi nanti.","rules.3.head":"Hentikan percikan api","rules.3.body":": Jika hanya satu dari dua PC yang terhubung kabel menjalankan Wingdows, percikan api merambat lewat kabel ke PC satunya. Menyeret ember dari kiri atas ke percikan api hanya membuatnya mulai lagi dari awal. Untuk menghentikannya, seret OS yang jatuh ke PC yang menjalankan Wingdows (api berhenti saat tidak ada ujung yang menjalankan Wingdows). PC yang berubah menjadi Wingdows karena percikan api tidak menjatuhkan OS lamanya, jadi pakai OS yang dijatuhkan Bill lain.","rules.4":"Permainan berakhir saat tersisa 1 PC atau kurang yang menyala. Setiap level selesai, kamu mendapat bonus sesuai lamanya PC tetap menyala.","rules.5.head":"Selesaikan level 10 untuk menang!","rules.5.body":" Di level yang lebih tinggi, lebih banyak Bill datang bersamaan, lebih cepat, dan mencuri OS lebih cepat. Selesaikan semua level untuk mengunduh sertifikat (gambar) dengan namamu.","credit.line":"XBill 2.1  Copyright (C) Brian Wellington, Matias Duarte (GPL). Aturan dan gambar berasal dari permainan aslinya.","credit.source":"Kode sumber permainan ini (GPL-3.0 atau lebih baru): ","title.start":"🎮 MULAI (START)","title.fullscreen":"⛶ Layar penuh","title.sub1":"Lindungi OS sumber terbuka dari gerombolan Bill!","title.sub2":"Cegah pemasangan paksa Wingdows!","help.title":"Panduan XBill (aturan asli)","help.keys":"Tombol: P / Esc = jeda, M = suara","help.close":"Tutup","level.n":"LEVEL {n}","level.final":"LEVEL {n} AKHIR","clear.headline":"Semua Bill berhasil dikalahkan!","clear.killed":"Bill dikalahkan: {n}","clear.goto":"▶ Lanjut ke {next}","label.bonus":"Bonus waktu menyala: ","label.score":"Skor: ","label.finalScore":"Skor akhir: ","result.bonus":"Bonus waktu menyala: +{n} pts","result.allClearBonus":"Bonus tamat: +{n} pts","result.clearedHeadline":"Selamat! Kamu menyelesaikan semua level dan menggagalkan ambisi Wingdows!","result.overHeadline":"Tersisa 1 PC atau kurang yang menyala...","result.retry":"🔄 Main lagi","name.placeholder":"Nama (maks. 12 karakter)","name.aria":"Nama untuk papan peringkat","name.submit":"🏆 Kirim","name.sending":"Mengirim...","name.rank":"Kamu di peringkat {rank}!","name.outOfRank":"Kali ini tidak masuk peringkat. Coba lagi!","name.error":"Gagal mengirim. Periksa koneksimu lalu coba lagi.","ranking.title":"🏆 Peringkat","ranking.titleLocal":"🏆 Peringkat (hanya di perangkat ini)","ranking.loading":"Memuat...","ranking.error":"Peringkat tidak dapat dimuat","ranking.empty":"Belum ada catatan","cert.button":"📜 Unduh sertifikat","cert.heading":"Sertifikat Tamat","cert.body":"Menyelesaikan semua {n} level XBill Web Remake dan menggagalkan ambisi Wingdows.","cert.score":"Skor akhir","cert.date":"Tanggal","cert.anonymous":"Pemain","story.button":"📖 Cerita","story.p1":"Sekali lagi, nasib dunia ada di tanganmu! Seorang peretas komputer jahat yang hanya dikenal dengan nama «Bill» telah menciptakan virus komputer pamungkas. Virus yang begitu kuat sampai bisa mengubah komputer biasa menjadi oven pemanggang roti. (ooh!) «Bill» telah mengklon dirinya menjadi miliaran micro-Bill. Satu-satunya tujuan mereka adalah menyebarkan virus jahat itu, yang disamarkan dengan cerdik sebagai sistem operasi populer.","story.p2":"Sebagai administrator sistem sekaligus pembasmi, tugasmu adalah mencegah Bill berhasil menjalankan rencananya."},"it":{"btn.pause":"Pausa (II)","btn.resume":"Riprendi (▶)","btn.reset":"Ricomincia","aria.sound":"Attiva o disattiva l’audio","aria.help":"Come si gioca","page.title":"XBill Web Remake - Colpisci i Bill, proteggi i tuoi sistemi operativi","lang.label":"Lingua","status.ready":"SYSTEM READY: sorveglianza contro i Bill...","status.pickedOs":"Hai raccolto {os}! Trascinalo su un PC dello stesso tipo per ripristinarlo!","status.pickedBucket":"Hai preso il secchio! Versalo su una scintilla per farla ripartire da capo!","status.restored":"{os} ripristinato!","status.bucketHit":"Scintilla bagnata!","status.bucketMiss":"Mancato... versa il secchio su una scintilla","status.paused":"In pausa","status.resumed":"Partita ripresa","status.levelStart":"LEVEL {n}: arrivano i Bill! Proteggi i PC!","status.levelStartFinal":"LEVEL {n} (FINALE): attacco in massa dei Bill! Resisti!","status.levelCleared":"LEVEL {n} completato!","status.allClear":"ALL CLEAR! Hai completato tutti i livelli!","status.gameOver":"Game over: restano al massimo 1 computer in funzione","status.imageError":"Impossibile caricare le immagini. Ricarica la pagina.","rules.title":"🕹️ Regole (basate sull’XBill 2.1 originale):","rules.1.head":"Colpisci i Bill","rules.1.body":": clicca o tocca per abbatterli. Più Bill sovrapposti colpisci in una volta, più punti ottieni (numero abbattuto al quadrato × 5 punti).","rules.2.head":"Riprenditi il sistema operativo","rules.2.body":": un Bill sostituisce il sistema operativo di un PC con Wingdows e scappa con quello rubato in testa. Colpiscilo e lo lascerà cadere: trascinalo su un PC dello stesso tipo. I Bill che scappano tornano più tardi.","rules.3.head":"Ferma le scintille","rules.3.body":": se solo uno di due PC collegati da un cavo ha Wingdows, una scintilla corre lungo il cavo verso l’altro. Trascinare il secchio in alto a sinistra su una scintilla la fa solo ripartire da capo. Per fermarla davvero, trascina un sistema caduto sul PC che ha Wingdows (si ferma quando nessuna estremità ha Wingdows). Un PC diventato Wingdows per colpa di una scintilla non lascia cadere il vecchio sistema: usa quello lasciato cadere da un altro Bill.","rules.4":"La partita finisce quando restano al massimo 1 PC in funzione. A ogni livello completato ricevi un bonus in base al tempo di funzionamento.","rules.5.head":"Completa il livello 10 per vincere!","rules.5.body":" Ai livelli alti arrivano più Bill insieme, più velocemente, e rubano i sistemi più in fretta. Completando tutti i livelli puoi scaricare un certificato (immagine) con il tuo nome.","credit.line":"XBill 2.1  Copyright (C) Brian Wellington, Matias Duarte (GPL). Regole e grafica provengono dal gioco originale.","credit.source":"Codice sorgente di questo gioco (GPL-3.0 o successiva): ","title.start":"🎮 GIOCA (START)","title.fullscreen":"⛶ Schermo intero","title.sub1":"Proteggi i sistemi operativi open source dall’orda di Bill!","title.sub2":"Impedisci l’installazione forzata di Wingdows!","help.title":"Guida a XBill (regole originali)","help.keys":"Tasti: P / Esc = pausa, M = audio","help.close":"Chiudi","level.n":"LEVEL {n}","level.final":"LEVEL {n} FINALE","clear.headline":"Hai respinto tutti i Bill!","clear.killed":"Bill sconfitti: {n}","clear.goto":"▶ Vai a {next}","label.bonus":"Bonus di funzionamento: ","label.score":"Punteggio: ","label.finalScore":"Punteggio finale: ","result.bonus":"Bonus di funzionamento: +{n} pts","result.allClearBonus":"Bonus completamento: +{n} pts","result.clearedHeadline":"Complimenti! Hai completato tutti i livelli e mandato in frantumi le ambizioni di Wingdows!","result.overHeadline":"Restano al massimo 1 PC in funzione...","result.retry":"🔄 Gioca ancora","name.placeholder":"Nome (max 12 caratteri)","name.aria":"Nome per la classifica","name.submit":"🏆 Invia","name.sending":"Invio in corso...","name.rank":"Sei al {rank}º posto!","name.outOfRank":"Stavolta non sei entrato in classifica. Riprova!","name.error":"Invio non riuscito. Controlla la connessione e riprova.","ranking.title":"🏆 Classifica","ranking.titleLocal":"🏆 Classifica (solo questo dispositivo)","ranking.loading":"Caricamento...","ranking.error":"Impossibile caricare la classifica","ranking.empty":"Ancora nessun punteggio","cert.button":"📜 Scarica il certificato","cert.heading":"Certificato di completamento","cert.body":"Ha completato tutti i {n} livelli di XBill Web Remake e mandato in frantumi le ambizioni di Wingdows.","cert.score":"Punteggio finale","cert.date":"Data","cert.anonymous":"Giocatore","story.button":"📖 La storia","story.p1":"Ancora una volta, il destino del mondo è nelle tue mani! Un malvagio hacker, noto solo con il nome «Bill», ha creato il virus informatico definitivo. Un virus così potente da trasformare un normale computer in un tostapane. (oooh!) «Bill» si è clonato in miliardi di micro-Bill. Il loro unico scopo è diffondere l'infame virus, astutamente camuffato da popolare sistema operativo.","story.p2":"Come amministratore di sistema e disinfestatore, il tuo compito è impedire a Bill di riuscire nel suo intento."},"ja":{"btn.pause":"ポーズ (II)","btn.resume":"再開 (▶)","btn.reset":"リセット","aria.sound":"サウンドの切り替え","aria.help":"遊び方","page.title":"XBill Web Remake - ビルを叩いて、OSを守れ","lang.label":"言語","status.ready":"SYSTEM READY: ビルの侵入を監視中...","status.pickedOs":"{os}を拾った！同じ種類のPCにドラッグして戻そう！","status.pickedBucket":"バケツを持った！火花にかけると、火花が最初からやり直しになる！","status.restored":"{os}を戻した！","status.bucketHit":"火花に水をかけた！","status.bucketMiss":"バケツは空振り…火花にかけよう","status.paused":"一時停止中","status.resumed":"ゲーム再開","status.levelStart":"LEVEL {n}: ビル軍団の襲来！PCを守れ！","status.levelStartFinal":"LEVEL {n} (最終): ビル軍団の総攻撃！PCを守り抜け！","status.levelCleared":"LEVEL {n} クリア！","status.allClear":"ALL CLEAR! すべてのレベルをクリアしました！","status.gameOver":"ゲームオーバー: 動いているコンピュータが1台以下になりました","status.imageError":"画像を読み込めませんでした。ページを再読み込みしてください。","rules.title":"🕹️ ルール (オリジナル XBill 2.1 準拠):","rules.1.head":"ビルを叩く","rules.1.body":": クリック/タップで倒す。重なったビルを一度に倒すほど高得点（倒した数の2乗×5点）。","rules.2.head":"OSを取り戻す","rules.2.body":": ビルはPCのOSをWingdowsに入れ替え、盗んだOSを頭に載せて逃げる。叩くとOSを落とすので、ドラッグして同じ種類のPCに戻す。逃げ切られたビルはまた戻ってくる。","rules.3.head":"火花を止める","rules.3.body":": ケーブルでつながったPCの片方だけがWingdowsだと、そこから相手へ火花が走る。左上のバケツをドラッグして火花にかけると、火花が最初からやり直しになるだけ。火花を止めるには、Wingdowsになっている側のPCに、落ちているOSをドラッグして戻す（両方がWingdowsでなくなれば止まる）。火花でWingdowsになったPCは元のOSが落ちないので、ほかのビルを叩いて落としたOSを使う。","rules.4":"動いているPCが1台以下になるとゲームオーバー。レベルが終わるたびに、稼働率に応じたボーナス。","rules.5.head":"レベル10をクリアで全クリア！","rules.5.body":" 上のレベルほど、ビルは何体も同時に、多く・速く押し寄せ、OSを抜くのも速くなる。全クリアすると、名前入りの証明書（画像）をダウンロードできる。","credit.line":"XBill 2.1  Copyright (C) Brian Wellington, Matias Duarte (GPL)。ルールと絵はオリジナルのものです。","credit.source":"このゲームのソース (GPL-3.0以降): ","title.start":"🎮 スタート (START)","title.fullscreen":"⛶ フルスクリーン切替","title.sub1":"ビル軍団からオープンソースOSを守れ！","title.sub2":"Wingdowsの強制インストールを叩き潰して阻止せよ！","help.title":"XBill ガイド (オリジナル仕様)","help.keys":"キー操作: P / Esc = ポーズ、M = サウンド切替","help.close":"閉じる","level.n":"LEVEL {n}","level.final":"最終 LEVEL {n}","clear.headline":"すべてのビルを撃退しました！","clear.killed":"倒したビル: {n}体","clear.goto":"▶ {next} に進む","label.bonus":"稼働率ボーナス: ","label.score":"スコア: ","label.finalScore":"最終スコア: ","result.bonus":"稼働率ボーナス: +{n} pts","result.allClearBonus":"全クリアボーナス: +{n} pts","result.clearedHeadline":"おめでとう！全レベルをクリアし、Wingdowsの野望を打ち砕きました！","result.overHeadline":"動いているPCが1台以下になってしまいました...","result.retry":"🔄 もう一度遊ぶ","name.placeholder":"なまえ (最大12文字)","name.aria":"ランキングに載せる名前","name.submit":"🏆 登録","name.sending":"送信中...","name.rank":"第{rank}位にランクイン！","name.outOfRank":"ランク外でした。また挑戦しよう！","name.error":"登録できませんでした。通信状況を確認して、もう一度お試しください。","ranking.title":"🏆 ランキング","ranking.titleLocal":"🏆 ランキング (この端末のみ)","ranking.loading":"読み込み中...","ranking.error":"ランキングを取得できませんでした","ranking.empty":"まだ記録がありません","cert.button":"📜 証明書をダウンロード","cert.heading":"全クリア証明書","cert.body":"XBill Web Remake の全{n}レベルをクリアし、Wingdows の野望を打ち砕きました。","cert.score":"最終スコア","cert.date":"日付","cert.anonymous":"名無しさん","story.button":"📖 ストーリー","story.p1":"またしても、世界の運命はあなたの手に委ねられた！「ビル」とだけ名乗る邪悪なコンピュータ・ハッカーが、究極のコンピュータウイルスを作り出したのだ。普通のコンピュータをトースターに変えてしまうほど強力なウイルスである。（ひえ〜！）「ビル」は自分自身を何十億ものミニ・ビルに複製した。彼らの唯一の目的は、人気のオペレーティングシステムに巧みに偽装した、この邪悪なウイルスを届けることだ。","story.p2":"システム管理者／駆除担当として、あなたの仕事は、ビルの企みを成功させないことだ。"},"ko":{"btn.pause":"일시정지 (II)","btn.resume":"계속 (▶)","btn.reset":"리셋","aria.sound":"소리 켜기/끄기","aria.help":"게임 방법","page.title":"XBill Web Remake - 빌을 때려서 OS를 지켜라","lang.label":"언어","status.ready":"SYSTEM READY: 빌의 침입을 감시 중...","status.pickedOs":"{os}을(를) 주웠다! 같은 종류의 PC로 끌어다 복구하자!","status.pickedBucket":"양동이를 들었다! 불꽃에 물을 끼얹으면 불꽃이 처음부터 다시 시작된다!","status.restored":"{os} 복구 완료!","status.bucketHit":"불꽃에 물을 끼얹었다!","status.bucketMiss":"빗나갔다… 불꽃을 노리자","status.paused":"일시정지 중","status.resumed":"게임 재개","status.levelStart":"LEVEL {n}: 빌 군단의 습격! PC를 지켜라!","status.levelStartFinal":"LEVEL {n} (최종): 빌 군단의 총공격! PC를 끝까지 지켜라!","status.levelCleared":"LEVEL {n} 클리어!","status.allClear":"ALL CLEAR! 모든 레벨을 클리어했습니다!","status.gameOver":"게임 오버: 작동 중인 컴퓨터가 1대 이하가 되었습니다","status.imageError":"이미지를 불러올 수 없습니다. 페이지를 새로고침하세요.","rules.title":"🕹️ 규칙 (오리지널 XBill 2.1 기준):","rules.1.head":"빌을 때리기","rules.1.body":": 클릭/탭으로 쓰러뜨린다. 겹친 빌을 한꺼번에 쓰러뜨릴수록 고득점 (쓰러뜨린 수의 제곱×5점).","rules.2.head":"OS 되찾기","rules.2.body":": 빌은 PC의 OS를 Wingdows로 바꾸고, 훔친 OS를 머리에 얹고 도망친다. 때리면 OS를 떨어뜨리니, 같은 종류의 PC로 끌어다 놓자. 도망친 빌은 다시 돌아온다.","rules.3.head":"불꽃 막기","rules.3.body":": 케이블로 연결된 PC 중 한쪽만 Wingdows이면, 그쪽에서 상대로 불꽃이 달려간다. 왼쪽 위의 양동이를 끌어다 불꽃에 끼얹어도 불꽃이 처음부터 다시 시작될 뿐이다. 완전히 멈추려면 Wingdows가 된 쪽 PC에 떨어진 OS를 끌어다 놓자 (양쪽 모두 Wingdows가 아니게 되면 멈춘다). 불꽃 때문에 Wingdows가 된 PC는 원래 OS를 떨어뜨리지 않으므로, 다른 빌을 때려서 떨어뜨린 OS를 쓰자.","rules.4":"작동 중인 PC가 1대 이하가 되면 게임 오버. 레벨이 끝날 때마다 가동률에 따른 보너스를 받는다.","rules.5.head":"레벨 10을 클리어하면 올 클리어!","rules.5.body":" 높은 레벨일수록 빌이 여러 명씩, 더 많이, 더 빠르게 몰려오고 OS를 빼앗는 속도도 빨라진다. 올 클리어하면 이름이 들어간 증명서(이미지)를 다운로드할 수 있다.","credit.line":"XBill 2.1  Copyright (C) Brian Wellington, Matias Duarte (GPL). 규칙과 그림은 오리지널 게임의 것입니다.","credit.source":"이 게임의 소스 (GPL-3.0 이상): ","title.start":"🎮 시작 (START)","title.fullscreen":"⛶ 전체 화면 전환","title.sub1":"오픈소스 OS를 빌 군단으로부터 지켜라!","title.sub2":"Wingdows의 강제 설치를 박살내서 막아라!","help.title":"XBill 가이드 (오리지널 규칙)","help.keys":"키 조작: P / Esc = 일시정지, M = 소리 전환","help.close":"닫기","level.n":"LEVEL {n}","level.final":"최종 LEVEL {n}","clear.headline":"모든 빌을 물리쳤습니다!","clear.killed":"쓰러뜨린 빌: {n}명","clear.goto":"▶ {next}(으)로 진행","label.bonus":"가동률 보너스: ","label.score":"점수: ","label.finalScore":"최종 점수: ","result.bonus":"가동률 보너스: +{n} pts","result.allClearBonus":"올 클리어 보너스: +{n} pts","result.clearedHeadline":"축하합니다! 모든 레벨을 클리어하고 Wingdows의 야망을 분쇄했습니다!","result.overHeadline":"작동 중인 PC가 1대 이하가 되고 말았습니다...","result.retry":"🔄 다시 하기","name.placeholder":"이름 (최대 12자)","name.aria":"랭킹에 올릴 이름","name.submit":"🏆 등록","name.sending":"전송 중...","name.rank":"{rank}위에 랭크인!","name.outOfRank":"이번에는 랭킹에 들지 못했습니다. 다시 도전하자!","name.error":"등록하지 못했습니다. 통신 상태를 확인하고 다시 시도하세요.","ranking.title":"🏆 랭킹","ranking.titleLocal":"🏆 랭킹 (이 기기에서만)","ranking.loading":"불러오는 중...","ranking.error":"랭킹을 가져오지 못했습니다","ranking.empty":"아직 기록이 없습니다","cert.button":"📜 증명서 다운로드","cert.heading":"올 클리어 증명서","cert.body":"XBill Web Remake의 전체 {n}개 레벨을 클리어하고 Wingdows의 야망을 분쇄했습니다.","cert.score":"최종 점수","cert.date":"날짜","cert.anonymous":"플레이어","story.button":"📖 스토리","story.p1":"이번에도 세계의 운명은 당신의 손에 달렸다! 오직 '빌'이라는 이름으로만 알려진 사악한 컴퓨터 해커가 궁극의 컴퓨터 바이러스를 만들어냈다. 평범한 컴퓨터를 토스터 오븐으로 바꿔 버릴 만큼 강력한 바이러스다. (오오!) '빌'은 자신을 수십억 마리의 마이크로 빌로 복제했다. 이들의 유일한 목적은, 인기 있는 운영체제로 교묘하게 위장한 이 사악한 바이러스를 퍼뜨리는 것이다.","story.p2":"시스템 관리자 겸 해충 박멸자로서, 당신의 임무는 빌이 목적을 이루지 못하게 막는 것이다."},"nl":{"btn.pause":"Pauze (II)","btn.resume":"Hervat (▶)","btn.reset":"Opnieuw","aria.sound":"Geluid aan/uit","aria.help":"Hoe te spelen","page.title":"XBill Web Remake - Sla de Bills, bescherm je besturingssystemen","lang.label":"Taal","status.ready":"SYSTEM READY: de Bills in de gaten houden...","status.pickedOs":"{os} opgepakt! Sleep het naar een pc van hetzelfde type om het te herstellen!","status.pickedBucket":"Emmer gepakt! Gooi hem op een vonk zodat die opnieuw begint!","status.restored":"{os} hersteld!","status.bucketHit":"Vonk nat gemaakt!","status.bucketMiss":"Mis... gooi de emmer op een vonk","status.paused":"Gepauzeerd","status.resumed":"Spel hervat","status.levelStart":"LEVEL {n}: de Bills komen eraan! Bescherm de pc’s!","status.levelStartFinal":"LEVEL {n} (FINALE): de Bills vallen massaal aan! Hou vol!","status.levelCleared":"LEVEL {n} voltooid!","status.allClear":"ALL CLEAR! Je hebt alle levels gehaald!","status.gameOver":"Game over: er draait nog maar 1 computer of minder","status.imageError":"De afbeeldingen konden niet worden geladen. Laad de pagina opnieuw.","rules.title":"🕹️ Regels (naar het originele XBill 2.1):","rules.1.head":"Sla de Bills","rules.1.body":": klik of tik om ze neer te halen. Hoe meer overlappende Bills je in één keer raakt, hoe meer punten (aantal neergehaald in het kwadraat × 5 punten).","rules.2.head":"Haal het besturingssysteem terug","rules.2.body":": een Bill vervangt het besturingssysteem van een pc door Wingdows en rent weg met het gestolen systeem op zijn hoofd. Sla hem en hij laat het vallen — sleep het naar een pc van hetzelfde type. Bills die ontsnappen komen later terug.","rules.3.head":"Stop de vonken","rules.3.body":": draait maar één van twee met een kabel verbonden pc’s Wingdows, dan loopt er een vonk over de kabel naar de andere. Sleep je de emmer linksboven op een vonk, dan begint die alleen opnieuw. Om hem echt te stoppen sleep je een gevallen besturingssysteem naar de pc met Wingdows (hij stopt zodra geen van beide uiteinden Wingdows heeft). Een pc die door een vonk Wingdows werd, laat zijn oude systeem niet vallen; gebruik er een dat een andere Bill liet vallen.","rules.4":"Het spel eindigt als er nog maar 1 pc of minder draait. Na elk level krijg je een bonus op basis van de looptijd.","rules.5.head":"Haal level 10 om te winnen!","rules.5.body":" Op hogere levels komen er meer Bills tegelijk, sneller, en stelen ze sneller systemen. Haal alle levels en je kunt een certificaat (afbeelding) met je naam downloaden.","credit.line":"XBill 2.1  Copyright (C) Brian Wellington, Matias Duarte (GPL). De regels en afbeeldingen komen uit het originele spel.","credit.source":"Broncode van dit spel (GPL-3.0 of nieuwer): ","title.start":"🎮 START","title.fullscreen":"⛶ Volledig scherm","title.sub1":"Bescherm open-source besturingssystemen tegen de horde Bills!","title.sub2":"Voorkom de gedwongen installatie van Wingdows!","help.title":"XBill-handleiding (originele regels)","help.keys":"Toetsen: P / Esc = pauze, M = geluid","help.close":"Sluiten","level.n":"LEVEL {n}","level.final":"LEVEL {n} (FINALE)","clear.headline":"Je hebt alle Bills verslagen!","clear.killed":"Verslagen Bills: {n}","clear.goto":"▶ Naar {next}","label.bonus":"Looptijdbonus: ","label.score":"Score: ","label.finalScore":"Eindscore: ","result.bonus":"Looptijdbonus: +{n} pts","result.allClearBonus":"All-clear-bonus: +{n} pts","result.clearedHeadline":"Gefeliciteerd! Je hebt alle levels gehaald en de plannen van Wingdows verpletterd!","result.overHeadline":"Er draait nog maar 1 pc of minder...","result.retry":"🔄 Nog een keer","name.placeholder":"Naam (max. 12 tekens)","name.aria":"Naam voor de ranglijst","name.submit":"🏆 Versturen","name.sending":"Bezig met versturen...","name.rank":"Je staat op plaats {rank}!","name.outOfRank":"Deze keer niet in de ranglijst. Probeer het opnieuw!","name.error":"Versturen mislukt. Controleer je verbinding en probeer opnieuw.","ranking.title":"🏆 Ranglijst","ranking.titleLocal":"🏆 Ranglijst (alleen dit apparaat)","ranking.loading":"Laden...","ranking.error":"De ranglijst kon niet worden geladen","ranking.empty":"Nog geen scores","cert.button":"📜 Certificaat downloaden","cert.heading":"Certificaat van voltooiing","cert.body":"Heeft alle {n} levels van XBill Web Remake gehaald en de plannen van Wingdows verpletterd.","cert.score":"Eindscore","cert.date":"Datum","cert.anonymous":"Speler","story.button":"📖 Het verhaal","story.p1":"Opnieuw ligt het lot van de wereld in jouw handen! Een kwaadaardige computerhacker, alleen bekend onder de naam „Bill”, heeft het ultieme computervirus gemaakt. Een virus zo krachtig dat het een gewone computer in een broodrooster kan veranderen. (oooh!) „Bill” heeft zichzelf gekloond tot miljarden micro-Bills. Hun enige doel is het snode virus te verspreiden, slim vermomd als een populair besturingssysteem.","story.p2":"Als systeembeheerder en ongediertebestrijder is het jouw taak te voorkomen dat Bill zijn doel bereikt."},"pl":{"btn.pause":"Pauza (II)","btn.resume":"Wznów (▶)","btn.reset":"Od nowa","aria.sound":"Włącz lub wyłącz dźwięk","aria.help":"Jak grać","page.title":"XBill Web Remake - Bij Billów, ochroń swoje systemy","lang.label":"Język","status.ready":"SYSTEM READY: obserwujemy inwazję Billów...","status.pickedOs":"Podniesiono {os}! Przeciągnij go na komputer tego samego typu, aby go przywrócić!","status.pickedBucket":"Masz wiadro! Chluśnij nim na iskrę, a zacznie od początku!","status.restored":"Przywrócono {os}!","status.bucketHit":"Iskra zalana!","status.bucketMiss":"Pudło... chluśnij wiadrem na iskrę","status.paused":"Wstrzymano","status.resumed":"Gra wznowiona","status.levelStart":"LEVEL {n}: Billowie nadchodzą! Chroń komputery!","status.levelStartFinal":"LEVEL {n} (FINAŁ): generalny atak Billów! Wytrwaj!","status.levelCleared":"LEVEL {n} ukończony!","status.allClear":"ALL CLEAR! Ukończyłeś wszystkie poziomy!","status.gameOver":"Koniec gry: działa najwyżej 1 komputer","status.imageError":"Nie udało się wczytać obrazów. Odśwież stronę.","rules.title":"🕹️ Zasady (według oryginalnego XBill 2.1):","rules.1.head":"Bij Billów","rules.1.body":": kliknij lub dotknij, aby ich powalić. Im więcej nakładających się Billów trafisz naraz, tym więcej punktów (liczba powalonych do kwadratu × 5 punktów).","rules.2.head":"Odzyskaj system","rules.2.body":": Bill zamienia system komputera na Wingdows i ucieka ze skradzionym systemem na głowie. Uderz go, a go upuści — przeciągnij system na komputer tego samego typu. Billowie, którzy uciekną, wrócą później.","rules.3.head":"Zatrzymaj iskry","rules.3.body":": jeśli tylko jeden z dwóch komputerów połączonych kablem ma Wingdows, po kablu pobiegnie iskra do drugiego. Przeciągnięcie wiadra z lewego górnego rogu na iskrę tylko uruchomi ją od początku. Aby zatrzymać ją na dobre, przeciągnij upuszczony system na komputer z Wingdows (iskra gaśnie, gdy żaden koniec nie ma Wingdows). Komputer, który zmienił się w Wingdows przez iskrę, nie upuszcza starego systemu — użyj systemu upuszczonego przez innego Billa.","rules.4":"Gra kończy się, gdy działa najwyżej 1 komputer. Po każdym poziomie dostajesz premię zależną od czasu działania.","rules.5.head":"Ukończ poziom 10, by wygrać!","rules.5.body":" Na wyższych poziomach przychodzi więcej Billów naraz, szybciej, a systemy kradną szybciej. Po ukończeniu wszystkich poziomów możesz pobrać certyfikat (obraz) ze swoim imieniem.","credit.line":"XBill 2.1  Copyright (C) Brian Wellington, Matias Duarte (GPL). Zasady i grafika pochodzą z oryginalnej gry.","credit.source":"Kod źródłowy tej gry (GPL-3.0 lub nowsza): ","title.start":"🎮 START","title.fullscreen":"⛶ Pełny ekran","title.sub1":"Ochroń otwarte systemy operacyjne przed hordą Billów!","title.sub2":"Powstrzymaj przymusową instalację Wingdows!","help.title":"Przewodnik XBill (oryginalne zasady)","help.keys":"Klawisze: P / Esc = pauza, M = dźwięk","help.close":"Zamknij","level.n":"LEVEL {n}","level.final":"FINAŁOWY LEVEL {n}","clear.headline":"Odparłeś wszystkich Billów!","clear.killed":"Pokonanych Billów: {n}","clear.goto":"▶ Przejdź do: {next}","label.bonus":"Premia za działanie: ","label.score":"Wynik: ","label.finalScore":"Wynik końcowy: ","result.bonus":"Premia za działanie: +{n} pts","result.allClearBonus":"Premia za ukończenie: +{n} pts","result.clearedHeadline":"Gratulacje! Ukończyłeś wszystkie poziomy i zniweczyłeś plany Wingdows!","result.overHeadline":"Działa najwyżej 1 komputer...","result.retry":"🔄 Zagraj ponownie","name.placeholder":"Imię (maks. 12 znaków)","name.aria":"Imię do rankingu","name.submit":"🏆 Wyślij","name.sending":"Wysyłanie...","name.rank":"Zajmujesz {rank}. miejsce!","name.outOfRank":"Tym razem bez miejsca w rankingu. Spróbuj jeszcze raz!","name.error":"Nie udało się wysłać. Sprawdź połączenie i spróbuj ponownie.","ranking.title":"🏆 Ranking","ranking.titleLocal":"🏆 Ranking (tylko to urządzenie)","ranking.loading":"Wczytywanie...","ranking.error":"Nie udało się wczytać rankingu","ranking.empty":"Brak wyników","cert.button":"📜 Pobierz certyfikat","cert.heading":"Certyfikat ukończenia","cert.body":"Ukończył(a) wszystkie {n} poziomów XBill Web Remake i zniweczył(a) plany Wingdows.","cert.score":"Wynik końcowy","cert.date":"Data","cert.anonymous":"Gracz","story.button":"📖 Fabuła","story.p1":"Po raz kolejny los świata spoczywa w twoich rękach! Zły haker komputerowy, znany tylko pod pseudonimem „Bill”, stworzył ostateczny wirus komputerowy. Wirus tak potężny, że potrafi zamienić zwykły komputer w toster. (ooo!) „Bill” sklonował siebie w miliardy mikro-Billów. Ich jedynym celem jest dostarczenie podstępnego wirusa, sprytnie zamaskowanego jako popularny system operacyjny.","story.p2":"Jako administrator systemu i tępiciel masz za zadanie nie pozwolić Billowi osiągnąć celu."},"pt":{"btn.pause":"Pausar (II)","btn.resume":"Continuar (▶)","btn.reset":"Reiniciar","aria.sound":"Ativar ou desativar o som","aria.help":"Como jogar","page.title":"XBill Web Remake - Acerte os Bills e proteja seus sistemas operacionais","lang.label":"Idioma","status.ready":"SYSTEM READY: vigiando a invasão dos Bills...","status.pickedOs":"Você pegou o {os}! Arraste-o até um PC do mesmo tipo para restaurá-lo!","status.pickedBucket":"Você pegou o balde! Jogue-o sobre uma faísca para ela recomeçar do início!","status.restored":"{os} restaurado!","status.bucketHit":"Faísca molhada!","status.bucketMiss":"Errou... jogue o balde sobre uma faísca","status.paused":"Pausado","status.resumed":"Jogo retomado","status.levelStart":"LEVEL {n}: os Bills estão chegando! Proteja os PCs!","status.levelStartFinal":"LEVEL {n} (FINAL): ataque total dos Bills! Proteja os PCs!","status.levelCleared":"LEVEL {n} concluído!","status.allClear":"ALL CLEAR! Você concluiu todos os níveis!","status.gameOver":"Fim de jogo: restam apenas 1 computador ou nenhum funcionando","status.imageError":"Não foi possível carregar as imagens. Recarregue a página.","rules.title":"🕹️ Regras (baseadas no XBill 2.1 original):","rules.1.head":"Acerte os Bills","rules.1.body":": Clique ou toque para derrubá-los. Quanto mais Bills sobrepostos você derrubar de uma vez, mais pontos (quantidade derrubada ao quadrado × 5 pontos).","rules.2.head":"Recupere o sistema operacional","rules.2.body":": Um Bill troca o sistema do PC por Wingdows e foge com o sistema roubado na cabeça. Se você o acertar, ele derruba o sistema: arraste-o até um PC do mesmo tipo. Os Bills que escapam voltam depois.","rules.3.head":"Pare as faíscas","rules.3.body":": Se apenas um de dois PCs ligados por cabo estiver com Wingdows, uma faísca corre pelo cabo até o outro. Arrastar o balde do canto superior esquerdo até uma faísca só a faz recomeçar do início. Para pará-la de vez, arraste um sistema caído até o PC que está com Wingdows (ela para quando nenhuma ponta tiver Wingdows). Um PC que virou Wingdows por causa de uma faísca não derruba o sistema antigo, então use um derrubado por outro Bill.","rules.4":"O jogo termina quando restam apenas 1 PC ou nenhum funcionando. Ao fim de cada nível, você ganha um bônus conforme o tempo de funcionamento.","rules.5.head":"Conclua o nível 10 para vencer!","rules.5.body":" Nos níveis mais altos, mais Bills chegam ao mesmo tempo, mais rápido, e roubam os sistemas com mais rapidez. Ao concluir todos os níveis, você pode baixar um certificado (imagem) com o seu nome.","credit.line":"XBill 2.1  Copyright (C) Brian Wellington, Matias Duarte (GPL). As regras e os gráficos são do jogo original.","credit.source":"Código-fonte deste jogo (GPL-3.0 ou posterior): ","title.start":"🎮 COMEÇAR (START)","title.fullscreen":"⛶ Alternar tela cheia","title.sub1":"Proteja os sistemas operacionais livres da horda de Bills!","title.sub2":"Impeça a instalação forçada do Wingdows!","help.title":"Guia do XBill (regras originais)","help.keys":"Teclas: P / Esc = pausa, M = som","help.close":"Fechar","level.n":"LEVEL {n}","level.final":"LEVEL {n} (FINAL)","clear.headline":"Você derrotou todos os Bills!","clear.killed":"Bills derrotados: {n}","clear.goto":"▶ Ir para {next}","label.bonus":"Bônus de funcionamento: ","label.score":"Pontos: ","label.finalScore":"Pontuação final: ","result.bonus":"Bônus de funcionamento: +{n} pts","result.allClearBonus":"Bônus de conclusão total: +{n} pts","result.clearedHeadline":"Parabéns! Você concluiu todos os níveis e destruiu os planos do Wingdows!","result.overHeadline":"Restam apenas 1 PC ou nenhum funcionando...","result.retry":"🔄 Jogar de novo","name.placeholder":"Nome (máx. 12 caracteres)","name.aria":"Nome para o ranking","name.submit":"🏆 Enviar","name.sending":"Enviando...","name.rank":"Você entrou no ranking na posição {rank}!","name.outOfRank":"Desta vez você não entrou no ranking. Tente de novo!","name.error":"Não foi possível enviar. Verifique sua conexão e tente novamente.","ranking.title":"🏆 Ranking","ranking.titleLocal":"🏆 Ranking (somente neste dispositivo)","ranking.loading":"Carregando...","ranking.error":"Não foi possível carregar o ranking","ranking.empty":"Ainda não há registros","cert.button":"📜 Baixar certificado","cert.heading":"Certificado de conclusão","cert.body":"Concluiu os {n} níveis de XBill Web Remake e destruiu os planos do Wingdows.","cert.score":"Pontuação final","cert.date":"Data","cert.anonymous":"Jogador","story.button":"📖 História","story.p1":"Mais uma vez, o destino do mundo está em suas mãos! Um hacker malvado, conhecido apenas pelo apelido «Bill», criou o vírus de computador definitivo. Um vírus tão poderoso que é capaz de transformar um computador comum em uma torradeira. (oooh!) «Bill» clonou a si mesmo em bilhões de micro-Bills. O único objetivo deles é espalhar o vírus maligno, habilmente disfarçado de um sistema operacional popular.","story.p2":"Como administrador de sistemas e exterminador, sua missão é impedir que Bill alcance seu objetivo."},"ru":{"btn.pause":"Пауза (II)","btn.resume":"Продолжить (▶)","btn.reset":"Заново","aria.sound":"Включить или выключить звук","aria.help":"Как играть","page.title":"XBill Web Remake - бей Биллов, защити свои ОС","lang.label":"Язык","status.ready":"SYSTEM READY: следим за вторжением Биллов...","status.pickedOs":"Подобрана {os}! Перетащи её на компьютер того же типа, чтобы вернуть!","status.pickedBucket":"Взято ведро! Выплесни его на искру — она начнёт путь заново!","status.restored":"{os} восстановлена!","status.bucketHit":"Искра залита!","status.bucketMiss":"Мимо... лей ведро на искру","status.paused":"Пауза","status.resumed":"Игра продолжается","status.levelStart":"LEVEL {n}: Биллы идут! Защити компьютеры!","status.levelStartFinal":"LEVEL {n} (ФИНАЛ): Биллы атакуют все разом! Держись!","status.levelCleared":"LEVEL {n} пройден!","status.allClear":"ALL CLEAR! Все уровни пройдены!","status.gameOver":"Игра окончена: работает не больше 1 компьютера","status.imageError":"Не удалось загрузить изображения. Обнови страницу.","rules.title":"🕹️ Правила (по оригиналу XBill 2.1):","rules.1.head":"Бей Биллов","rules.1.body":": Кликни или коснись, чтобы вырубить. Чем больше пересекающихся Биллов накроешь за раз, тем больше очков (число сбитых в квадрате × 5).","rules.2.head":"Верни ОС","rules.2.body":": Билл заменяет ОС компьютера на Wingdows и убегает с украденной ОС на голове. Ударь его — он её уронит; перетащи ОС на компьютер того же типа. Убежавшие Биллы вернутся позже.","rules.3.head":"Останови искры","rules.3.body":": Если Wingdows стоит лишь на одном из двух компьютеров, соединённых кабелем, по кабелю к другому побежит искра. Если перетащить ведро из левого верхнего угла на искру, она лишь начнёт путь заново. Чтобы остановить её насовсем, перетащи упавшую ОС на компьютер с Wingdows (искра гаснет, когда Wingdows нет ни на одном конце). Компьютер, захваченный искрой, свою прежнюю ОС не роняет — используй ОС, которую уронил другой Билл.","rules.4":"Игра заканчивается, когда работает не больше 1 компьютера. После каждого уровня — бонус за время бесперебойной работы.","rules.5.head":"Пройди уровень 10 — и победа!","rules.5.body":" На высоких уровнях Биллов приходит больше, быстрее и сразу по несколько, и ОС они крадут быстрее. Пройдя все уровни, ты сможешь скачать сертификат (картинку) со своим именем.","credit.line":"XBill 2.1  Copyright (C) Brian Wellington, Matias Duarte (GPL). Правила и графика взяты из оригинальной игры.","credit.source":"Исходный код этой игры (GPL-3.0 или новее): ","title.start":"🎮 СТАРТ (START)","title.fullscreen":"⛶ Во весь экран","title.sub1":"Защити свободные ОС от орды Биллов!","title.sub2":"Не дай насильно установить Wingdows!","help.title":"Руководство XBill (правила оригинала)","help.keys":"Клавиши: P / Esc — пауза, M — звук","help.close":"Закрыть","level.n":"LEVEL {n}","level.final":"ФИНАЛЬНЫЙ LEVEL {n}","clear.headline":"Все Биллы отражены!","clear.killed":"Побеждено Биллов: {n}","clear.goto":"▶ К {next}","label.bonus":"Бонус за работу: ","label.score":"Очки: ","label.finalScore":"Итоговый счёт: ","result.bonus":"Бонус за работу: +{n} pts","result.allClearBonus":"Бонус за полное прохождение: +{n} pts","result.clearedHeadline":"Поздравляем! Ты прошёл все уровни и разрушил планы Wingdows!","result.overHeadline":"Работает не больше 1 компьютера...","result.retry":"🔄 Играть снова","name.placeholder":"Имя (до 12 символов)","name.aria":"Имя для таблицы рекордов","name.submit":"🏆 Отправить","name.sending":"Отправка...","name.rank":"Ты на {rank}-м месте!","name.outOfRank":"В этот раз в таблицу не попал. Попробуй ещё!","name.error":"Не удалось отправить. Проверь соединение и попробуй снова.","ranking.title":"🏆 Таблица рекордов","ranking.titleLocal":"🏆 Таблица рекордов (только это устройство)","ranking.loading":"Загрузка...","ranking.error":"Не удалось загрузить таблицу рекордов","ranking.empty":"Пока нет записей","cert.button":"📜 Скачать сертификат","cert.heading":"Сертификат о прохождении","cert.body":"Прошёл все {n} уровней XBill Web Remake и разрушил планы Wingdows.","cert.score":"Итоговый счёт","cert.date":"Дата","cert.anonymous":"Игрок","story.button":"📖 История","story.p1":"И снова судьба мира в твоих руках! Злой компьютерный хакер, известный лишь под ником «Билл», создал совершенный компьютерный вирус. Вирус настолько мощный, что способен превратить обычный компьютер в тостер. (ооо!) «Билл» клонировал себя в миллиарды микро-Биллов. Их единственная цель — доставить коварный вирус, хитро замаскированный под популярную операционную систему.","story.p2":"Ты — системный администратор и истребитель, и твоя задача — не дать Биллу добиться своего."},"tr":{"btn.pause":"Duraklat (II)","btn.resume":"Devam (▶)","btn.reset":"Sıfırla","aria.sound":"Sesi aç/kapat","aria.help":"Nasıl oynanır","page.title":"XBill Web Remake - Bill’lere vur, işletim sistemlerini koru","lang.label":"Dil","status.ready":"SYSTEM READY: Bill’lerin saldırısı izleniyor...","status.pickedOs":"{os} alındı! Geri koymak için aynı türden bir bilgisayara sürükle!","status.pickedBucket":"Kovayı aldın! Kıvılcımın üstüne dök, kıvılcım baştan başlasın!","status.restored":"{os} geri yüklendi!","status.bucketHit":"Kıvılcım ıslatıldı!","status.bucketMiss":"Iskaladın... kovayı bir kıvılcımın üstüne dök","status.paused":"Duraklatıldı","status.resumed":"Oyun devam ediyor","status.levelStart":"LEVEL {n}: Bill’ler geliyor! Bilgisayarları koru!","status.levelStartFinal":"LEVEL {n} (FİNAL): Bill’lerden topyekûn saldırı! Dayan!","status.levelCleared":"LEVEL {n} tamamlandı!","status.allClear":"ALL CLEAR! Tüm seviyeleri tamamladın!","status.gameOver":"Oyun bitti: çalışan en fazla 1 bilgisayar kaldı","status.imageError":"Görseller yüklenemedi. Sayfayı yenile.","rules.title":"🕹️ Kurallar (orijinal XBill 2.1’e göre):","rules.1.head":"Bill’lere vur","rules.1.body":": Tıkla veya dokun, devirsin. Üst üste binen ne kadar çok Bill’i tek seferde vurursan o kadar çok puan alırsın (devrilen sayının karesi × 5 puan).","rules.2.head":"İşletim sistemini geri al","rules.2.body":": Bill, bir bilgisayarın işletim sistemini Wingdows ile değiştirir ve çaldığı sistemi başında taşıyarak kaçar. Ona vurursan sistemi düşürür — onu aynı türden bir bilgisayara sürükle. Kaçan Bill’ler daha sonra geri gelir.","rules.3.head":"Kıvılcımları durdur","rules.3.body":": Kabloyla bağlı iki bilgisayardan yalnızca birinde Wingdows varsa, kablo boyunca diğerine bir kıvılcım koşar. Sol üstteki kovayı kıvılcımın üstüne sürüklemek onu yalnızca baştan başlatır. Kalıcı olarak durdurmak için düşmüş bir sistemi Wingdows çalışan bilgisayara sürükle (iki ucunda da Wingdows kalmayınca durur). Kıvılcımla Wingdows olan bilgisayar eski sistemini düşürmez; başka bir Bill’in düşürdüğü sistemi kullan.","rules.4":"Çalışan en fazla 1 bilgisayar kalırsa oyun biter. Her seviye sonunda çalışma süresine göre bonus alırsın.","rules.5.head":"10. seviyeyi bitir, oyunu kazan!","rules.5.body":" Üst seviyelerde aynı anda daha çok Bill, daha hızlı gelir ve sistemleri daha çabuk çalar. Tüm seviyeleri bitirirsen, adının yazılı olduğu bir sertifikayı (görsel) indirebilirsin.","credit.line":"XBill 2.1  Copyright (C) Brian Wellington, Matias Duarte (GPL). Kurallar ve görseller orijinal oyundandır.","credit.source":"Bu oyunun kaynak kodu (GPL-3.0 veya sonrası): ","title.start":"🎮 BAŞLA (START)","title.fullscreen":"⛶ Tam ekranı aç/kapat","title.sub1":"Açık kaynaklı işletim sistemlerini Bill sürüsünden koru!","title.sub2":"Wingdows’un zorla kurulmasını engelle!","help.title":"XBill Rehberi (orijinal kurallar)","help.keys":"Tuşlar: P / Esc = duraklat, M = ses","help.close":"Kapat","level.n":"LEVEL {n}","level.final":"FİNAL LEVEL {n}","clear.headline":"Tüm Bill’leri püskürttün!","clear.killed":"Yenilen Bill: {n}","clear.goto":"▶ {next} seviyesine geç","label.bonus":"Çalışma süresi bonusu: ","label.score":"Puan: ","label.finalScore":"Toplam puan: ","result.bonus":"Çalışma süresi bonusu: +{n} pts","result.allClearBonus":"Tam tamamlama bonusu: +{n} pts","r   (function () {
    'use strict';
    const DICTS = window.XBILL_I18N;
    const SUPPORTED = ['ja', 'en', 'zh-CN', 'zh-TW', 'ko', 'es', 'fr', 'de', 'pt', 'ru', 'hi', 'id', 'it', 'nl', 'pl', 'tr'];
    const NATIVE_NAMES = {
      'ja': '日本語', 'en': 'English', 'zh-CN': '简体中文', 'zh-TW': '繁體中文', 'ko': '한국어',
      'es': 'Español', 'fr': 'Français', 'de': 'Deutsch', 'pt': 'Português',
      'ru': 'Русский', 'hi': 'हिन्दी', 'id': 'Bahasa Indonesia', 'it': 'Italiano', 'nl': 'Nederlands', 'pl': 'Polski', 'tr': 'Türkçe'
    };
    const LANG_KEY = 'xbill_lang';

    function readSaved() {
      try { return window.localStorage.getItem(LANG_KEY); } catch (e) { return null; }
    }

    /** ブラウザの言語（例: zh-Hant-TW, pt-BR, en-US）を、対応言語のどれかに丸める。合わなければ null。 */
    function matchLang(tag) {
      if (!tag) return null;
      const lower = String(tag).toLowerCase();
      if (lower.startsWith('zh')) {
        return /hant|-tw|-hk|-mo/.test(lower) ? 'zh-TW' : 'zh-CN';
      }
      const base = lower.split('-')[0];
      return SUPPORTED.find((l) => l.toLowerCase() === base) || null;
    }

    function detectLang() {
      let fromUrl = null;
      try { fromUrl = new URLSearchParams(window.location.search).get('lang'); } catch (e) { /* 無視 */ }
      const candidates = [fromUrl, readSaved()];
      for (const c of candidates) {
        const m = SUPPORTED.find((l) => l.toLowerCase() === String(c || '').toLowerCase());
        if (m) return m;
      }
      const prefs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
      for (const p of prefs) {
        const m = matchLang(p);
        if (m) return m;
      }
      return 'en';
    }

    const lang = detectLang();
    const dict = DICTS[lang] || DICTS.en;

    /** 辞書を引く。{name} の部分は params で置き換える。無い鍵は ja → 鍵そのもの、の順で代用。 */
    function t(key, params) {
      let s = Object.prototype.hasOwnProperty.call(dict, key) ? dict[key]
        : (DICTS.ja && DICTS.ja[key] !== undefined ? DICTS.ja[key] : key);
      if (params) s = s.replace(/\{(\w+)\}/g, (m, k) => (params[k] !== undefined ? String(params[k]) : m));
      return s;
    }

    function setLang(next) {
      if (!SUPPORTED.includes(next)) return;
      try { window.localStorage.setItem(LANG_KEY, next); } catch (e) { /* 保存できなくても、URL で切り替える */ }
      const url = new URL(window.location.href);
      url.searchParams.set('lang', next);
      window.location.href = url.toString();
    }

    /** 静的な HTML の data-i18n（テキスト）と data-i18n-aria（aria-label）を埋める。 */
    function applyStatic() {
      document.documentElement.lang = lang;
      document.title = t('page.title');
      document.querySelectorAll('[data-i18n]').forEach((n) => { n.textContent = t(n.getAttribute('data-i18n')); });
      document.querySelectorAll('[data-i18n-aria]').forEach((n) => { n.setAttribute('aria-label', t(n.getAttribute('data-i18n-aria'))); });
    }

    window.XBILL_LANG = { lang, supported: SUPPORTED, names: NATIVE_NAMES, t, setLang, applyStatic };
    applyStatic();
  })();
</script>

  const CONFIG = {

    MAX_ASPECT: 1.6,         // 長い辺は短い辺の何倍まで伸ばすか（それ以上は両脇を空ける）

  // レベルごとの難易度。どの項目も、上のレベルほど確実に厳しくなる。
  //   bills: そのレベルで倒すビルの総数。逃げ切られたビルは戻ってくるので、全員を倒すとレベル終了

  //   steal: ビルが PC の前で OS を入れ替える時間（秒。原作は 2.6）
  //   spark: 火花の進む速さ（画面の px/s。原作は 20）
  // PC の台数（8+レベル、最大20）とケーブルの本数（レベル、または台数の半分）は原作の式のまま。
  // 調整するときはここだけ触ればよい（bills・rate・group・speed・spark は増やすと難しく、steal は減らすと難しい）。
  const LEVELS = [
    { bills:  12, rate: 1.00, group: 3, speed:  38, steal: 1.75, spark: 10 },

    { bills:  42, rate: 1.28, group: 4, speed:  65, steal: 1.46, spark: 19 },
    { bills:  51, rate: 1.48, group: 4, speed:  71, steal: 1.38, spark: 20 },
    { bills:  61, rate: 1.69, group: 4, speed:  78, steal: 1.29, spark: 22 },
    { bills:  72, rate: 1.97, group: 5, speed:  86, steal: 1.21, spark: 24 },
    { bills:  84, rate: 2.25, group: 5, speed:  93, steal: 1.12, spark: 26 },
    { bills:  97, rate: 2.58, group: 6, speed: 100, steal: 1.04, spark: 28 }
  ];

  /** 出現イベントの平均間隔 (ms)。1 回に平均 (1+group)/2 体出るので、rate から逆算する。 */
  function spawnIntervalMs(params) {
    return ((1 + params.group) / 2) / params.rate * 1000;
  }

  function levelParams(level) {
    return LEVELS[clamp(level, 1, LEVELS.length) - 1];
  }

  const FONT_CSS_URL =
    'https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap';

  // Web フォントは後から読み込む（取得できなくても起動を待たせない）

  // ============================================================
  // ユーティリティ
  // ============================================================
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

  /** DOM 要素を作る。文字列の子は textContent 相当で入るので、外部入力を渡しても安全。 */
  function el(tag, props, ...children) {
