# XBill Web Remake のランキング API（Cloudflare Workers + KV）
name = "xbill-ranking"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# ブラウザからの呼び出しを許す Origin（カンマ区切り）。本番は GitHub Pages だけ。
# 手元で確認するときは: npx wrangler dev --var "ALLOWED_ORIGINS:http://127.0.0.1:8000"
ALLOWED_ORIGINS = "https://kawade502.github.io"
# 全クリア記念 SBT の申請を受け付けるか（"true" で受付。mint の準備が揃うまでは "false"）
SBT_REQUESTS_ENABLED = "true"
# ビールジョッキ（beer-jug）の杯数の記念 SBT の申請を受け付けるか（"true" で受付。止めるときは "false"）
BEER_SBT_REQUESTS_ENABLED = "true"
# ビールジョッキの記念 SBT のコントラクトアドレス（Polygon Mainnet）。Worker は使わないが、mint のときの参照用
BEER_SBT_CONTRACT = "0x7CF5663c1afa9123a3aB94800aF65ffCB2456ef2"

# 短い時間の回数制限（Rate Limiting binding）。namespace_id はこのアカウントの中で重ならない番号なら何でもよい。
# ランキングの送信は、同じ送り元から1分10回まで
[[ratelimits]]
name = "SCORE_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60

# SBT の申請（XBill・ビールジョッキ）は、同じ送り元から1分3件まで
[[ratelimits]]
name = "SBT_IP_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 3
  period = 60

# SBT の申請は、全体で1分20件まで
[[ratelimits]]
name = "SBT_ALL_LIMITER"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 20
  period = 60

[[kv_namespaces]]
binding = "RANKING"
# `npx wrangler kv namespace create RANKING` で出た id に置き換える（秘密ではない）
id = "a73595e9f37a45ee93f97bb53e28f664"
