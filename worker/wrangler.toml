# XBill Web Remake のランキング API（Cloudflare Workers + KV）
name = "xbill-ranking"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# ブラウザからの呼び出しを許す Origin（カンマ区切り）。本番は GitHub Pages だけ。
# 手元で確認するときは: npx wrangler dev --var "ALLOWED_ORIGINS:http://127.0.0.1:8000"
ALLOWED_ORIGINS = "https://kawade502.github.io"
# 全クリア記念 SBT の申請を受け付けるか（"true" で受付。mint の準備が揃うまでは "false"）
SBT_REQUESTS_ENABLED = "false"

[[kv_namespaces]]
binding = "RANKING"
# `npx wrangler kv namespace create RANKING` で出た id に置き換える（秘密ではない）
id = "a73595e9f37a45ee93f97bb53e28f664"
